{% extends 'base.html' %}

{% block title %}Discord Chat{% endblock %}

{% block content %}
<style>
    .chat-wrapper {
        padding: 20px 0 40px 0;
        display: flex;
        flex-direction: column;
        height: calc(100vh - 80px);
        min-height: 650px;
    }
    
    .widgetbot-container {
        width: 100%;
        flex-grow: 1;
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 15px 45px rgba(0, 0, 0, 0.85);
        border: 1px solid var(--border-glass);
        background-color: #313338;
        position: relative;
    }
    
    widgetbot {
        display: block;
        width: 100%;
        height: 100%;
        border: none !important;
        outline: none !important;
    }
</style>

<div class="container chat-wrapper">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="d-flex align-items-center gap-2">
            <div style="width: 5px; height: 26px; background: #5865F2; border-radius: 4px;"></div>
            <h3 class="fw-bold m-0 text-white">
                <i class="fab fa-discord me-2" style="color: #5865F2;"></i> RMBD DISCORD CHAT
            </h3>
        </div>
        <a href="https://discord.gg/2xhEsE63rJ" target="_blank" rel="noopener" class="btn btn-sm btn-outline-primary rounded-pill px-3" style="border-color: #5865F2; color: #fff;">
            Mở App Discord <i class="fas fa-external-link-alt ms-1"></i>
        </a>
    </div>
    
    <div class="widgetbot-container">
        <widgetbot
            server="1206994069256019989"
            channel="1206994877771157635"
            width="100%"
            height="100%"
        ></widgetbot>
        <script src="https://cdn.jsdelivr.net/npm/@widgetbot/html-embed"></script>
    </div>
</div>
{% endblock %}
